<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:-apple-system,Segoe UI,sans-serif;color:#e6edf3}

h2{font-size:18px;margin:0 0 14px} .row{display:flex;align-items:end;gap:22px;margin-bottom:18px}
.row img.a{border-radius:50%} .lbl{font-size:13px;opacity:.7;width:110px}

<div class="sec dark"><h2>A – Claude: &lt;PS/&gt;</h2>

<div class="sec dark"><h2>B – Gemini: Pascal Prism</h2>
